# render.yaml - Render.com 100% Free Blueprint Deployment
services:
  - type: web
    name: bonerag-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 10000
      - key: BONERAG_RECORD_LIMIT
        value: 4085
